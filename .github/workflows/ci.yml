name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Swift 6, macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Show toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build -v

      - name: Run tests
        run: swift test

      - name: Check sandbox variant
        run: swift build -Xswiftc -DMAS --scratch-path .build/mas-check

      - name: Build app bundle
        run: VERSION=0.0.0 BUILD=ci ./scripts/build_app.sh
